name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js types
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          BETTER_AUTH_SECRET: "ci-dummy-secret-at-least-32-characters-long"
          BETTER_AUTH_URL: "http://localhost:3000"
          GITHUB_CLIENT_ID: "ci-dummy-client-id"
          GITHUB_CLIENT_SECRET: "ci-dummy-client-secret"